<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Barbearia Sr. Dan</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <!-- MENU -->
  <nav id="menu" class="menu">
    <a href="../index.html">🏠 Home</a>
    <a href="../precos/precos.html">💰 Preços</a>
    <a href="../avaliacoes/avaliacoes.html">⭐ Avaliações</a>
    <a href="../agendamento/agendamento.html">📅 Agendamento</a>
    <a href="cadastro.html" class="ativo">📝 Cadastro</a>
    <a href="../perfil/perfil.html">👤 Perfil</a>
    
  </nav>

  <div class="container">

    <!-- CADASTRO -->
    <div class="lado-esquerdo">
      <form class="formulario" id="formCadastro">
        <h2>📝 Cadastre-se</h2>

        <input 
          type="text"
          name="nome"
          placeholder="Digite seu nome"
          required
          minlength="3"
        />

        <input 
          type="email"
          name="email"
          placeholder="Digite seu email"
          required
        />

        <input 
          type="tel"
          name="telefone"
          placeholder="Informe seu Nº de celular"
        />

        <input 
          type="password"
          name="senha"
          placeholder="Crie uma senha"
          required
          minlength="4"
        />

        <div id="mensagemCadastro" style="display:none;"></div>

        <button type="submit">✅ Realizar Cadastro</button>
      </form>
    </div>

    <!-- LOGIN -->
    <div class="lado-direito">
      <form class="formulario" id="formLogin">
        <h2>🔐 Login</h2>

        <input 
          type="email"
          name="loginEmail"
          placeholder="Digite seu email"
          required
        />

        <input 
          type="password"
          name="loginSenha"
          placeholder="Digite sua senha"
          required
        />

        <div id="mensagemLogin" style="display:none;"></div>

        <button type="submit">🚪 Entrar</button>
      </form>
    </div>

  </div>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <p>&copy; 2026 Barbearia Sr. Dan — Todos os direitos reservados</p>
  </footer>

  <script src="../js/cadastro.js"></script>
</body>
</html>
