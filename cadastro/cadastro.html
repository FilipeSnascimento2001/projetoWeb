<div class="container">

    <!-- CADASTRO -->

    <div class="lado-esquerdo">

        <form class="formulario">

            <h2 id="fontAlt">
                Cadastre-se
            </h2>

            <input 
                type="text"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <input 
                type="email"
                name="email"
                placeholder="Digite seu email"
                required
            >

            <input 
                type="tel"
                name="telefone"
                placeholder="Informe seu Nº de celular"
                required
            >

            <button type="submit">
                Realizar Cadastro
            </button>

        </form>

    </div>

    <!-- LOGIN -->

    <div class="lado-direito">

        <form class="formulario">

            <h2 id="fontAlt">
                Login
            </h2>

            <input 
                type="email"
                name="loginEmail"
                placeholder="Digite seu email"
                required
            >

            <input 
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</div>

<script src="../js/scripts.js"></script>
