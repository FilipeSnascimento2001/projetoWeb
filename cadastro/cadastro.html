<div class="container">

    <!-- ESQUERDA -->

    <div class="lado-esquerdo">

        <form class="formulario">

            <h2 id="fontAlt">
                Cadastro
            </h2>

            <input 
                type="text"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <input 
                type="email"
                name="email"
                placeholder="Digite seu email"
                required
            >

            <input 
                type="tel"
                name="telefone"
                placeholder="Informe seu Nº de celular"
                required
            >

            <textarea
                name="mensagem"
                placeholder="Observações do cliente"
                rows="5"
            ></textarea>

            <button type="submit">
                Realizar Cadastro
            </button>

        </form>

    </div>

    <div class="clientes">

    <h2 id="fontAlt">
        Clientes Cadastrados
    </h2>

    <div id="listaClientes"></div>

</div>

<script src="../js/scripts.js"></script>
